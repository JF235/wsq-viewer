[workspace]
resolver = "3"
members = ["crates/wsq", "crates/wsq-cli", "crates/wsq-wasm"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JF235/wsq-viewer"
rust-version = "1.89"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[profile.bench]
inherits = "release"
